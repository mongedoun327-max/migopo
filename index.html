    <script>
      // Gracefully suppress Vite HMR WebSocket alerts when HMR is disabled in cloud preview
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => String(a?.message || a)).join(' ');
          if (str.includes('WebSocket') || str.includes('vite') || str.includes('failed to connect to websocket')) {
            return;
          }
          return origError.apply(console, args);
        };
      })();
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason?.message || event.reason).includes('WebSocket') || String(event.reason?.message || event.reason).includes('vite'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
