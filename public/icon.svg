<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBB7D"/>
      <stop offset="48%" stop-color="#EFD1BE"/>
      <stop offset="100%" stop-color="#B3BDDC"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brandGradient)" stroke-width="4" opacity="0.3"/>

  <!-- Outer Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#brandGradient)" stroke-width="2.5" opacity="0.25" stroke-dasharray="10 14"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#brandGradient)" stroke-width="3" opacity="0.45"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="105" fill="url(#brandGradient)"/>

  <!-- Tactical Communicator / Radio Chat Bubble Icon -->
  <g fill="#020617">
    <!-- Chat Bubble Body -->
    <path d="M192 184
             H320
             A24 24 0 0 1 344 208
             V292
             A24 24 0 0 1 320 316
             H252
             L196 352
             V316
             H192
             A24 24 0 0 1 168 292
             V208
             A24 24 0 0 1 192 184Z"/>
  </g>

  <!-- Soundwave / Antenna Cross inside the Bubble -->
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="216" x2="256" y2="284"/>
    <line x1="222" y1="250" x2="290" y2="250"/>
  </g>

  <!-- Tactical Nodes Sparkles -->
  <circle cx="120" cy="140" r="12" fill="#00B98B"/>
  <circle cx="396" cy="160" r="10" fill="url(#brandGradient)"/>
  <circle cx="380" cy="370" r="14" fill="#00B98B"/>
  <circle cx="130" cy="360" r="9" fill="url(#brandGradient)"/>
</svg>
